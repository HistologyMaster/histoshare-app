<rect x="640" y="205" width="300" height="92" rx="8" fill="#fbf3e6" stroke="#a9742c" stroke-width="2"/><text x="790.0" y="234.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Excluidos en la identificación</text><text x="790.0" y="256.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">homónimos no neurales</text><text x="790.0" y="278.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">n = 30</text>
