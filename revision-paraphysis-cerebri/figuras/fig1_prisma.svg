<rect x="380" y="640" width="280" height="110" rx="8" fill="#fbf3e6" stroke="#a9742c" stroke-width="2"/><text x="520.0" y="678.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Solo título/metadatos</text><text x="520.0" y="700.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">A: n = 44;  B: n = 0</text><text x="520.0" y="722.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">sin atribución de hallazgos</text>
<line x1="200" y1="750" x2="200" y2="810" stroke="#3b5b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="810" width="520" height="110" rx="8" fill="#e6f3ea" stroke="#2f7a4d" stroke-width="2"/><text x="320.0" y="848.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">SÍNTESIS NARRATIVA</text><text x="320.0" y="870.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">7 dominios; cada afirmación con marcador de evidencia</text><text x="320.0" y="892.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">verificada por revisores independientes</text>
<text x="60" y="960" font-size="13" fill="#1f2933">Nivel A = paráfisis como objeto principal o con datos/análisis explícitos; Nivel B = contexto necesario para interpretarla.</text>
