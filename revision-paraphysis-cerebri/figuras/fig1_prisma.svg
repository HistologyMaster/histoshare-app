<rect x="60" y="330" width="520" height="92" rx="8" fill="#eef3f8" stroke="#3b5b7a" stroke-width="2"/><text x="320.0" y="359.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">CRIBADO</text><text x="320.0" y="381.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">Título/resumen/extracto; dos revisores independientes</text><text x="320.0" y="403.0" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2933">n = 633  (acuerdo 93,4 %, κ = 0,873)</text>
